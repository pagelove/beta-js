name: Deploy

# Pushing to prod publishes the library to two places: GitHub Pages, which is
# where browsers import it from, and the Pagelove host.
# Promote by pushing main to prod: git push origin main:prod
on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Upload every file, not just what changed'
        type: boolean
        default: false

# One deploy at a time, and never cancel one mid-flight — a half-applied sync
# leaves the host serving a mixture of two commits.
concurrency:
  group: pagelove-deploy-Production
  cancel-in-progress: false

jobs:
  # Runs once, and both publish jobs depend on it. Running the suite here
  # rather than trusting main means a direct push to prod cannot skip it.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test

  # Publishing to Pages and publishing to Pagelove are deliberately separate
  # jobs rather than steps in one. They are independent destinations, so a
  # problem reaching one must not stop the other being updated.
  pages:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Publish the library only. Everything else in the repo is tooling, and
      # the site is public, so there is no reason to put it there.
      - name: Stage the library
        run: |
          set -euo pipefail
          mkdir -p _site
          cp LICENSE pagelove.mjs _site/
          cp -R pagelove _site/pagelove
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      # Pages serves every asset with Access-Control-Allow-Origin, so this is
      # the copy a page on another origin can actually import.
      - name: Verify what a browser gets
        env:
          PAGELOVE_WEBDAV_URL: ${{ vars.PAGELOVE_WEBDAV_URL }}
          PAGELOVE_PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/verify-deploy.sh
          .github/scripts/verify-deploy.sh

  pagelove:
    needs: test
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff against the previous commit

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync to WebDAV
        env:
          # The WebDAV URL is an environment variable; the API key is a secret.
          PAGELOVE_WEBDAV_URL: ${{ vars.PAGELOVE_WEBDAV_URL }}
          PAGELOVE_API_KEY: ${{ secrets.PAGELOVE_API_KEY }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          FULL_SYNC: ${{ inputs.full_sync }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/sync-webdav.sh

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$FULL_SYNC" = "true" ]; then
              .github/scripts/sync-webdav.sh --all
            else
              .github/scripts/sync-webdav.sh "${SHA}^" "$SHA"
            fi
            exit 0
          fi

          # prod maps to exactly one host, so the previous commit on prod is
          # what that host already has. A first push, or a force-push whose old
          # commit is gone, has no such anchor — fall back to a full sync
          # rather than guessing at a diff.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable previous commit; falling back to a full sync."
            .github/scripts/sync-webdav.sh --all
          else
            .github/scripts/sync-webdav.sh "$BEFORE" "$SHA"
          fi

      # A module that uploaded badly still answers 200, so check what the host
      # actually serves rather than trusting the PUT status codes.
      #
      # CORS is not required here. This host cannot add the header without
      # corrupting the file, so Pages is the copy that browsers import. The
      # check still asserts the bytes are served, typed and parseable.
      - name: Verify what the host serves
        env:
          PAGELOVE_WEBDAV_URL: ${{ vars.PAGELOVE_WEBDAV_URL }}
          # Optional. Derived from the WebDAV URL when unset.
          PAGELOVE_PUBLIC_URL: ${{ vars.PAGELOVE_PUBLIC_URL }}
          REQUIRE_CORS: '0'
        run: |
          set -euo pipefail
          chmod +x .github/scripts/verify-deploy.sh
          .github/scripts/verify-deploy.sh

      - name: Summarise
        if: always()
        env:
          PAGELOVE_WEBDAV_URL: ${{ vars.PAGELOVE_WEBDAV_URL }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Pagelove deploy ${STATUS}"
            echo ""
            echo "- Host: \`${PAGELOVE_WEBDAV_URL:-(unset)}\`"
            echo "- Commit: \`${GITHUB_SHA:0:12}\`"
          } >> "$GITHUB_STEP_SUMMARY"
